services:
  - type: web
    name: biddrop-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_ORIGINS
        value: https://biddrop-web.onrender.com,http://localhost:8081,http://127.0.0.1:8081
      - key: JWT_SECRET
        generateValue: true
      # Login token lifetime in minutes (7 days): the app remembers the token on the device
      - key: JWT_TTL_MIN
        value: "10080"
      # Account emails (verification, password reset) are sent through Resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: BidDrop <onboarding@resend.dev>
      - key: APP_WEB_URL
        value: https://biddrop-web.onrender.com

  - type: web
    name: biddrop-web
    runtime: static
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: EXPO_PUBLIC_POBA_API
        value: https://biddrop-api.onrender.com
      - key: EXPO_PUBLIC_WC_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_ALLOW_MATCH_TRIGGERS
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
