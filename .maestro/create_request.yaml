# End-to-end: a signed-in sender publishes a request and gets a match.
# Needs the demo couriers (python scripts/demo_data.py add) and a signed-in session
# (run login.yaml first, or sign in by hand in the emulator).
appId: com.biddrop.app
---
- launchApp
- extendedWaitUntil:
    visible: "נתחיל"
    timeout: 30000
- tapOn: "נתחיל"
- extendedWaitUntil:
    visible: ".*שולח/ת חבילה.*"
    timeout: 30000
- tapOn: ".*שולח/ת חבילה.*"
- extendedWaitUntil:
    visible: ".*הוספת בקשה חדשה.*"
    timeout: 30000
- tapOn: ".*הוספת בקשה חדשה.*"
- tapOn: "התחל/י להקליד, לדוגמה: בן גוריון 10, תל אביב"
- inputText: "מנחם בגין 132"
- extendedWaitUntil:
    visible: ".*Boston Consulting Group.*"
    timeout: 15000
- tapOn: ".*Boston Consulting Group.*"
- tapOn: "התחל/י להקליד, לדוגמה: הרצל 5, ראשון לציון"
- inputText: "ז'בוטינסקי, רמת גן"
- extendedWaitUntil:
    visible: ".*אבא הלל.*"
    timeout: 15000
- tapOn: ".*אבא הלל.*"
- tapOn: ".*התחלה.*"
- tapOn: "אישור"
- tapOn: ".*סיום.*"
- tapOn: "אישור"
- tapOn: "אני"
- scrollUntilVisible:
    element:
      text: "לדוגמה: 75"
    direction: DOWN
- tapOn: "לדוגמה: 75"
- inputText: "30"
- tapOn: "פרסום בקשה"
- extendedWaitUntil:
    visible: "נמצאה התאמה!"
    timeout: 60000
